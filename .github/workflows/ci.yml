name: Allo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: allo-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm install
      - name: Check server syntax
        run: node --check server.js
      - name: Check runtime syntax
        run: node --check runtime.js
      - name: Check browser syntax
        run: node --check public/app.js
      - name: Run test suite
        run: npm test

  container-build:
    name: Build bundled runtime image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Allo image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: allo-ai:ci
