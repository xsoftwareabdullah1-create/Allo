services:
  ollama:
    image: ollama/ollama:latest
    container_name: allo-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  allo:
    build: .
    container_name: allo-web
    restart: unless-stopped
    depends_on:
      - ollama
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  ollama_data:
