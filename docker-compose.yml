services:
  allo:
    build: .
    image: allo-ai:local
    container_name: allo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
      ALLO_LLAMACPP_BIN: /opt/llama-install/bin/llama-server
      ALLO_MAX_LOADED_MODELS: ${ALLO_MAX_LOADED_MODELS:-1}
      ALLO_CONTEXT_SIZE: ${ALLO_CONTEXT_SIZE:-4096}
      ALLO_GPU_LAYERS: ${ALLO_GPU_LAYERS:-0}
    ports:
      - "3000:3000"
    volumes:
      - allo_data:/app/data
    init: true
    stop_grace_period: 30s

volumes:
  allo_data:
